    <script>
      const DATA_BASE = "data2/";
      const SEARCH_RADIUS_KM = 10;
      const MAX_STATIONS = 12;
      const REMINDER_STORAGE_KEY = "tankzeit-sparrechner-reminder";
      const WEEKDAYS = [
        "Sonntag",
        "Montag",
        "Dienstag",
        "Mittwoch",
        "Donnerstag",
        "Freitag",
        "Samstag",
      ];
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const formEl = document.getElementById("savings-form");
      const locationRequestBtn = document.getElementById("location-request-btn");
      const fuelEl = document.getElementById("fuel");
      const consumptionEl = document.getElementById("consumption");
      const dayKmInputs = Array.from({ length: 7 }, (_, index) =>
        document.getElementById(`km-${index}`),
      );
      const tankVolumeEl = document.getElementById("tank-volume");
      const currentLitersEl = document.getElementById("current-liters");
      let currentCenter = null;
      let nearbyStations = [];
      let activeTankPlan = [];
      let reminderTimeoutId = null;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type === "error" ? "error" : ""}`;
        statusEl.style.display = "block";
      }

      function clearStatus() {
        statusEl.style.display = "none";
      }

      function stationDataPath(stationId, fuel, fileName) {
        return `${DATA_BASE}${stationId.split("-").join("/")}/${fuel}/${fileName}`;
      }

      function stationStatsPath(stationId, fuel) {
        return `${DATA_BASE}${stationId.split("-").join("/")}/${fuel}.json`;
      }

      async function fetchText(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.text();
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      function parseHistory(csv) {
        return csv
          .trim()
          .split(/\r?\n/)
          .slice(1)
          .map((line) => {
            const [date, price] = line.split(",");
            const parsedPrice = Number(price);
            if (!date || !Number.isFinite(parsedPrice)) return null;
            return {
              date,
              price: parsedPrice,
              weekday: new Date(`${date}T12:00:00`).getDay(),
            };
          })
          .filter(Boolean);
      }

      function average(values) {
        if (!values.length) return null;
        return values.reduce((sum, value) => sum + value, 0) / values.length;
      }

      function weekdayAverages(history) {
        const buckets = Array.from({ length: 7 }, () => []);
        history.forEach((row) => buckets[row.weekday].push(row.price));
        return buckets.map((values, index) => ({
          weekday: index,
          price: average(values),
          samples: values.length,
        }));
      }

      function recommendationWindow(stats) {
        const cycleRows = TankzeitStats.cycleMarkdownSeries(stats, {
          includeClosingNoon: false,
        });
        if (cycleRows.length) {
          const bestMarkdown = Math.max(...cycleRows.map((row) => row.markdown));
          const bestRow = cycleRows
            .filter((row) => row.markdown === bestMarkdown)
            .sort((left, right) => left.cycleHour - right.cycleHour)[0];
          return {
            markdown: bestMarkdown,
            startHour: bestRow ? bestRow.clockHour : null,
            text: TankzeitStats.relativeMinimumText(stats, "abends"),
          };
        }
        const min = TankzeitStats.toNumber(stats && stats.min);
        const bestHours = Array.isArray(stats && stats.besthours)
          ? stats.besthours
              .map((hour) => Number(hour))
              .filter((hour) => Number.isFinite(hour))
          : [];
        return {
          markdown: min === null ? 0 : Math.abs(min),
          startHour: bestHours.length ? bestHours[0] : null,
          text: TankzeitStats.relativeMinimumText(stats, "abends"),
        };
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("de-DE", {
          style: "currency",
          currency: "EUR",
          maximumFractionDigits: 2,
        }).format(value);
      }

      function formatPrice(value) {
        return `${value.toFixed(3).replace(".", ",")} €/l`;
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat("de-DE", {
          weekday: "long",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(date);
      }

      function dateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function formatStationNameText(station) {
        return station.brand
          ? `${station.name} (${station.brand})`
          : station.name;
      }

      function tankStopStartDate(item) {
        const start = new Date(item.date);
        const hour = Number.isFinite(item.startHour) ? item.startHour : 18;
        start.setHours(Math.max(0, Math.min(23, Math.floor(hour))), 0, 0, 0);
        return start;
      }

      function reminderDateForStop(item) {
        const reminderDate = tankStopStartDate(item);
        reminderDate.setDate(reminderDate.getDate() - 1);
        reminderDate.setHours(18, 0, 0, 0);
        const minimumDate = new Date(Date.now() + 5000);
        return reminderDate > minimumDate ? reminderDate : minimumDate;
      }

      function reminderPayload(item) {
        const station = formatStationNameText(item.station);
        return {
          reminderAt: reminderDateForStop(item).toISOString(),
          stopAt: tankStopStartDate(item).toISOString(),
          station,
          dateLabel: formatDate(item.date),
          timeText: item.timeText,
          liters: item.litersToFill.toFixed(1).replace(".", ","),
          price: formatPrice(item.price),
          saving: formatCurrency(item.saving),
        };
      }

      function notificationBody(payload) {
        return `${payload.dateLabel}: ${payload.timeText} bei ${payload.station}. ${payload.liters} l geplant, Preis ca. ${payload.price}.`;
      }

      function showTankReminder(payload) {
        if (!("Notification" in window) || Notification.permission !== "granted") {
          return;
        }
        new Notification("Morgen günstig tanken", {
          body: notificationBody(payload),
          tag: "tankzeit-next-stop",
        });
      }

      function scheduleStoredReminder() {
        if (reminderTimeoutId) {
          window.clearTimeout(reminderTimeoutId);
          reminderTimeoutId = null;
        }
        const raw = localStorage.getItem(REMINDER_STORAGE_KEY);
        if (!raw) return;
        let payload;
        try {
          payload = JSON.parse(raw);
        } catch {
          localStorage.removeItem(REMINDER_STORAGE_KEY);
          return;
        }
        if (new Date(payload.stopAt).getTime() < Date.now()) {
          localStorage.removeItem(REMINDER_STORAGE_KEY);
          return;
        }
        const delay = new Date(payload.reminderAt).getTime() - Date.now();
        const maxDelay = 24 * 60 * 60 * 1000;
        reminderTimeoutId = window.setTimeout(() => {
          if (delay > maxDelay) {
            scheduleStoredReminder();
            return;
          }
          showTankReminder(payload);
          localStorage.removeItem(REMINDER_STORAGE_KEY);
        }, Math.max(0, Math.min(delay, maxDelay)));
      }

      async function enableReminderForNextStop() {
        const nextStop = activeTankPlan[0];
        if (!nextStop) {
          setStatus("Es gibt noch keinen Tankstopp für eine Erinnerung.", "error");
          return;
        }
        if (!("Notification" in window)) {
          setStatus("Benachrichtigungen werden in diesem Browser nicht unterstützt.", "error");
          return;
        }
        let permission = Notification.permission;
        if (permission === "default") {
          permission = await Notification.requestPermission();
        }
        if (permission !== "granted") {
          setStatus("Benachrichtigungen wurden nicht erlaubt.", "error");
          return;
        }
        const payload = reminderPayload(nextStop);
        localStorage.setItem(REMINDER_STORAGE_KEY, JSON.stringify(payload));
        scheduleStoredReminder();
        setStatus(
          `App-Benachrichtigung aktiv: am Vortag um 18:00 Uhr für ${payload.dateLabel}, ${payload.timeText}.`,
        );
      }

      function formatStationNameHtml(station) {
        const label = escapeHtml(formatStationNameText(station));
        const badge =
          window.TankzeitCustomerAwards?.badgeForStation(station.id) || "";
        return `<span class="station-name-with-award"><span>${label}</span>${badge}</span>`;
      }

      function readInputs() {
        const dailyKm = dayKmInputs.map((input) => Number(input.value));
        return {
          fuel: fuelEl.value,
          consumption: Number(consumptionEl.value),
          dailyKm,
          weeklyKm: dailyKm.reduce(
            (sum, value) => sum + (Number.isFinite(value) ? value : 0),
            0,
          ),
          tankVolume: Number(tankVolumeEl.value),
          currentLiters: Number(currentLitersEl.value),
        };
      }

      function validateInputs(inputs) {
        return (
          Number.isFinite(inputs.consumption) &&
          inputs.consumption > 0 &&
          Number.isFinite(inputs.weeklyKm) &&
          inputs.weeklyKm > 0 &&
          inputs.dailyKm.every((value) => Number.isFinite(value) && value >= 0) &&
          Number.isFinite(inputs.tankVolume) &&
          inputs.tankVolume > 0 &&
          Number.isFinite(inputs.currentLiters) &&
          inputs.currentLiters >= 0 &&
          inputs.currentLiters <= inputs.tankVolume
        );
      }

      function startOfToday(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      async function stationProfile(station, inputs) {
        const [stats, historyCsv] = await Promise.all([
          fetchJson(stationStatsPath(station.id, inputs.fuel)),
          fetchText(stationDataPath(station.id, inputs.fuel, "history.csv")),
        ]);
        const history = parseHistory(historyCsv);
        const averageNoon = average(history.map((row) => row.price));
        const windowInfo = recommendationWindow(stats);
        const averages = weekdayAverages(history).filter((row) => row.price !== null);
        if (!averages.length || averageNoon === null) return null;
        return {
          station,
          averages,
          averageNoon,
          markdown: windowInfo.markdown,
          startHour: windowInfo.startHour,
          timeText: windowInfo.text,
          profileText: TankzeitStats.profileText(stats, "Preisprofil"),
        };
      }

      function candidateForDate(profile, date, inputs) {
        const weekday = date.getDay();
        const dayAverage = profile.averages.find((row) => row.weekday === weekday);
        if (!dayAverage) return null;
        const price = Math.max(0, dayAverage.price - profile.markdown);
        const savingPerLiter = Math.max(0, profile.averageNoon - price);
        return {
          station: profile.station,
          date: new Date(date),
          dateKey: dateKey(date),
          price,
          savingPerLiter,
          timeText: profile.timeText,
          startHour: profile.startHour,
        };
      }

      function consumptionForDate(date, inputs) {
        return (inputs.dailyKm[date.getDay()] * inputs.consumption) / 100;
      }

      function nextDeadlineDate(startDate, litersAvailable, inputs) {
        const date = startOfToday(startDate);
        let fuel = litersAvailable;
        for (let offset = 0; offset < 120; offset += 1) {
          const need = consumptionForDate(date, inputs);
          if (fuel < need) return new Date(date);
          fuel -= need;
          date.setDate(date.getDate() + 1);
        }
        return new Date(date);
      }

      function fuelUsedBetween(startDate, endDate, inputs) {
        const cursor = startOfToday(startDate);
        const endKey = dateKey(endDate);
        let used = 0;
        while (dateKey(cursor) < endKey) {
          used += consumptionForDate(cursor, inputs);
          cursor.setDate(cursor.getDate() + 1);
        }
        return used;
      }

      function buildCandidates(profiles, fromDate, throughDate, inputs) {
        const today = startOfToday(fromDate);
        const end = startOfToday(throughDate);
        const currentHour = fromDate.getHours() + fromDate.getMinutes() / 60;
        const candidates = [];
        for (const profile of profiles) {
          const cursor = new Date(today);
          while (cursor <= end) {
            const candidate = candidateForDate(profile, cursor, inputs);
            if (candidate) {
              const isToday = dateKey(cursor) === dateKey(fromDate);
              if (
                !isToday ||
                candidate.startHour === null ||
                currentHour < candidate.startHour + 1
              ) {
                candidates.push(candidate);
              }
            }
            cursor.setDate(cursor.getDate() + 1);
          }
        }
        return candidates.sort((left, right) => {
          if (left.price !== right.price) return left.price - right.price;
          if (left.date - right.date !== 0) return left.date - right.date;
          return left.station.dist - right.station.dist;
        });
      }

      function buildTankPlan(profiles, inputs) {
        const plan = [];
        let availableFuel = inputs.currentLiters;
        let cursorDate = new Date();
        for (let stopIndex = 0; stopIndex < 4; stopIndex += 1) {
          const deadline = nextDeadlineDate(cursorDate, availableFuel, inputs);
          const candidates = buildCandidates(profiles, cursorDate, deadline, inputs);
          if (!candidates.length) break;
          const stop = candidates[0];
          const fuelBeforeStop = Math.max(
            0,
            availableFuel - fuelUsedBetween(cursorDate, stop.date, inputs),
          );
          const litersToFill = Math.max(0, inputs.tankVolume - fuelBeforeStop);
          plan.push({
            ...stop,
            litersToFill,
            fuelBeforeStop,
            cost: litersToFill * stop.price,
            saving: litersToFill * stop.savingPerLiter,
          });
          availableFuel = inputs.tankVolume;
          cursorDate = new Date(stop.date);
          cursorDate.setDate(cursorDate.getDate() + 1);
        }
        return plan;
      }

      function renderResults(plan, inputs) {
        activeTankPlan = plan;
        if (!plan.length) {
          resultsEl.innerHTML = `
            <article class="card savings-empty">
              <h2>Keine ausreichenden Daten</h2>
              <p>Für deine Eingaben konnte kein Tankplan erstellt werden.</p>
            </article>
          `;
          return;
        }
        const litersPerWeek = (inputs.weeklyKm * inputs.consumption) / 100;
        const totalSaving = plan.reduce((sum, stop) => sum + stop.saving, 0);
        const totalLiters = plan.reduce((sum, stop) => sum + stop.litersToFill, 0);
        resultsEl.innerHTML = `
          <section class="card savings-recommendation">
            <div>
              <p class="savings-kicker">Tankplanung ab jetzt</p>
              <h2>Nächste 4 Tankstopps</h2>
              <p>${totalLiters.toFixed(1).replace(".", ",")} l geplant · ${litersPerWeek.toFixed(1).replace(".", ",")} l Verbrauch pro Woche</p>
            </div>
            <div class="savings-money">${formatCurrency(totalSaving)}</div>
          </section>
          <section class="savings-metrics">
            <article class="card savings-metric">
              <span>geplante Ersparnis</span>
              <strong>${formatCurrency(totalSaving)}</strong>
            </article>
            <article class="card savings-metric">
              <span>Liter geplant</span>
              <strong>${totalLiters.toFixed(1).replace(".", ",")} l</strong>
            </article>
            <article class="card savings-metric">
              <span>nächster Stopp</span>
              <strong>${formatDate(plan[0].date).split(",")[0]}</strong>
            </article>
            <article class="card savings-metric">
              <span>Verbrauch pro Woche</span>
              <strong>${litersPerWeek.toFixed(1).replace(".", ",")} l</strong>
            </article>
          </section>
          <section class="card savings-reminder-card">
            <div>
              <p class="savings-kicker">App-Benachrichtigung</p>
              <h2>Am Vortag erinnern lassen</h2>
              <p>
                Die App merkt sich den nächsten Tankstopp und erinnert dich am
                Vortag um 18:00 Uhr mit Tag und empfohlener Uhrzeit.
              </p>
            </div>
            <button class="btn primary" id="tank-reminder-btn" type="button">
              Benachrichtigung aktivieren
            </button>
          </section>
          <section class="card">
            <table class="table">
              <thead>
                <tr>
                  <th>Station</th>
                  <th>Datum</th>
                  <th>Uhrzeit</th>
                  <th>Liter</th>
                  <th>Preis</th>
                  <th>Ersparnis</th>
                </tr>
              </thead>
              <tbody>
                ${plan
                  .map(
                    (item, index) => `
                    <tr>
                      <td data-label="Station">${index + 1}. ${formatStationNameHtml(item.station)}</td>
                      <td data-label="Datum">${escapeHtml(formatDate(item.date))}</td>
                      <td data-label="Uhrzeit">${escapeHtml(item.timeText)}</td>
                      <td data-label="Liter">${item.litersToFill.toFixed(1).replace(".", ",")} l</td>
                      <td data-label="Preis">${formatPrice(item.price)}</td>
                      <td data-label="Ersparnis">${formatCurrency(item.saving)}</td>
                    </tr>
                  `,
                  )
                  .join("")}
              </tbody>
            </table>
          </section>
        `;
      }

      async function calculate() {
        const inputs = readInputs();
        if (!validateInputs(inputs)) {
          setStatus("Bitte gültige Werte eintragen.", "error");
          return;
        }
        if (!nearbyStations.length) {
          setStatus("Standort wird benötigt, damit nahe Tankstellen berechnet werden können.");
          requestLocation();
          return;
        }
        setStatus("Tankplan wird berechnet...");
        await window.TankzeitCustomerAwards?.loadAwards();
        const settled = await Promise.allSettled(
          nearbyStations.map((station) => stationProfile(station, inputs)),
        );
        const profiles = settled
          .filter((result) => result.status === "fulfilled" && result.value)
          .map((result) => result.value);
        renderResults(buildTankPlan(profiles, inputs), inputs);
        clearStatus();
      }

      async function loadNearbyStations(lat, lng) {
        currentCenter = { lat, lng };
        setStatus("Nahe Tankstellen werden geladen...");
        const catalog = await TankzeitStationCatalog.loadCatalog();
        nearbyStations = TankzeitStationCatalog.findNearbyStations(catalog, lat, lng, {
          limit: MAX_STATIONS,
          radiusKm: SEARCH_RADIUS_KM,
        });
        if (!nearbyStations.length) {
          setStatus("Keine Tankstellen im Umkreis gefunden.", "error");
          return;
        }
        await calculate();
      }

      function setLocationButtonBusy(isBusy) {
        locationRequestBtn.disabled = isBusy;
        locationRequestBtn.textContent = isBusy
          ? "Standort wird geladen..."
          : "Standort abrufen";
      }

      function requestLocation() {
        if (!navigator.geolocation) {
          setStatus("Standort ist in diesem Browser nicht verfügbar.", "error");
          return;
        }
        setLocationButtonBusy(true);
        setStatus("Standort wird ermittelt...");
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            setLocationButtonBusy(false);
            try {
              await loadNearbyStations(
                position.coords.latitude,
                position.coords.longitude,
              );
            } catch (err) {
              console.warn("Savings calculation failed", err);
              setStatus("Daten konnten nicht geladen werden.", "error");
            }
          },
          (err) => {
            console.warn("Geolocation failed", err);
            setLocationButtonBusy(false);
            setStatus("Standort konnte nicht ermittelt werden.", "error");
          },
          { enableHighAccuracy: false, maximumAge: 300000, timeout: 20000 },
        );
      }

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        calculate();
      });
      resultsEl.addEventListener("click", (event) => {
        if (event.target && event.target.id === "tank-reminder-btn") {
          enableReminderForNextStop();
        }
      });
      [fuelEl, consumptionEl, tankVolumeEl, currentLitersEl, ...dayKmInputs].forEach((element) => {
        element.addEventListener("change", calculate);
      });
      locationRequestBtn.addEventListener("click", requestLocation);
      scheduleStoredReminder();
      requestLocation();
    </script>
  </body>
</html>
